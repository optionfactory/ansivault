# Playground for testing the AnsiVault plugin by hand: see README.md.
# Passwords are for testing only: dev = "dev-password" (from file), prod = "prod-password" (asked).
[defaults]
inventory = inventory.ini
# two vault ids: dev from a file, prod asked (and saved by the plugin in the IDE credential store)
vault_identity_list = dev@vault-pass/dev.txt, prod@prompt
# new vaults are encrypted with dev
vault_encrypt_identity = dev
# variants to try (or set them as ANSIBLE_* environment variables before starting the IDE):
# vault_id_match = true
# vault_password_file = vault-pass/dev.txt
